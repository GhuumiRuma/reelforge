name: Android app

# Every branch push builds an APK artifact; only main updates the public release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 fingerprint of the certificate every ReelForge.apk must be signed with (public information).
  # Android installs a new APK over an installed copy only when the signing certificate is identical, so a
  # build signed with any other key can't update the phones that already have ReelForge, and uninstalling
  # first deletes their projects. Change this only when you deliberately move to a new key.
  EXPECTED_CERT_SHA256: 7671c92462d13c9c7725ddbef4d21e3cb7e50d519c0c645d49fccf4f036c65cc

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Signing: the repository secrets hold the one permanent key, so every build installs over the
      # previous one. Without them (a fork) the build gets a one-off key: it installs on a phone that has
      # no ReelForge, but it can't update an installed copy, and main refuses to publish it.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            source=secrets
            for value in "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
              case "$value" in
                '')
                  echo "::error::Set all four secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
                  exit 1 ;;
                *$'\n'*|*$'\r'*)
                  echo "::error::A signing secret contains a line break. Set it again without a trailing newline."
                  exit 1 ;;
              esac
            done
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
            keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null \
              || { echo "::error::The signing keystore does not open with the stored password and alias."; exit 1; }
          else
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "::error::main publishes the app people update from, so it must be signed with the permanent key. Add the ANDROID_KEYSTORE_* secrets (see the README)."
              exit 1
            fi
            echo "::warning::No signing secrets are set, so this APK is signed with a one-off key. It can't update an installed ReelForge."
            source=one-off
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            KEY_ALIAS=reelforge
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            export KEYSTORE_PASSWORD KEY_PASSWORD
            keytool -genkeypair -noprompt -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ReelForge (one-off build)"
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "SIGNING_SOURCE=$source"
          } >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm test
      - run: npm run build:android
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk ReelForge.apk

      # Read the certificate back out of the finished APK, so what is checked is what people would install.
      - name: Check the signature
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          [ -n "$apksigner" ] || { echo "::error::apksigner was not found in the Android SDK."; exit 1; }
          report="$("$apksigner" verify --print-certs ReelForge.apk)"
          echo "::group::apksigner report"
          printf '%s\n' "$report"
          echo "::endgroup::"
          cert="$(printf '%s\n' "$report" | awk '/ certificate SHA-256 digest: / && !/Source Stamp/ { print tolower($NF); exit }')"
          printf '%s' "$cert" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::Could not read the signing certificate from ReelForge.apk. See the apksigner report above."; exit 1; }
          {
            echo "### Android app signature"
            echo "- Signing key: \`$SIGNING_SOURCE\`"
            echo "- Certificate SHA-256: \`$cert\`"
            echo "- Version code: \`${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNING_SOURCE" = secrets ] && [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The signing secrets give certificate $cert, but installed copies of ReelForge were signed with $EXPECTED_CERT_SHA256, so this build couldn't update them. Fix the secrets, or if you are deliberately moving to a new key, update EXPECTED_CERT_SHA256 in .github/workflows/android.yml."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ReelForge-android
          path: ReelForge.apk

      - name: Publish the "Latest Android app" release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub counts downloads per release, and this release is replaced on every push, so the new
          # notes carry the old release's running total (see scripts/download-stats.mjs). This is
          # best-effort: it must never stop the app from being published.
          marker=""
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/android-latest" > "$RUNNER_TEMP/previous-release.json"; then
            marker="$(node scripts/download-stats.mjs bank "$RUNNER_TEMP/previous-release.json" || true)"
          fi
          grep -Eqx '<!-- rf-banked-downloads:[0-9]+ -->' <<< "$marker" || marker=""
          {
            echo "Open this page on your Android phone and tap **ReelForge.apk** to download it, then open the file to install. Android asks you to allow installing apps from your browser the first time. Built from ${{ github.sha }}."
            if [ -n "$marker" ]; then
              echo
              echo "$marker"
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest ReelForge.apk \
            --title "Latest Android app (build ${{ github.run_number }})" \
            --target "${{ github.sha }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
