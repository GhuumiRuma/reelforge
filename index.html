<!doctype html>
<!--
THESIS: The video is the stage. ReelForge plays the InShot/CapCut editor layout straight, at full craft; it refuses novelty chrome and light consumer cards around the frame.
OWN-WORLD: Near-black stage #0b0b0f, graphite panels #16161d, hairline dividers #262631, white line icons over 11px labels, system UI type with tabular time. One hot pink #ff3d6e marks selection, active tools and Save; nothing else is colored except layer chips.
STORY: Open a project, scrub with a thumb, tap a clip to get its tools, adjust in a bottom panel, save an MP4 to share.
FIRST VIEWPORT: Top bar (close, project name, resolution chip, pink Save pill top-right); letterboxed preview ~45% height; transport row (time, play, undo/redo); timeline with centered white playhead; scrollable tool strip at the thumb.
FORM: Category standard (standing exit, chosen by the user); staging is InShot's native composition; seed key ee614ce0.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Applies the saved mode and look before first paint so nobody sees the default for a moment first.
      // Mirrors src/state/theme.ts (storage keys, "system" default, light background color) and the look that
      // src/state/appearance.ts saves: its CSS and page colors are applied as they are. prepaint.test.ts runs this.
      (function () {
        var pref = null;
        var saved = null;
        try {
          pref = localStorage.getItem('rf-theme');
          saved = localStorage.getItem('rf-look');
        } catch (e) {}
        var light =
          pref === 'light' || (pref !== 'dark' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        var theme = light ? 'light' : 'dark';
        var bg = light ? '#f4f4f8' : '#0b0b0f';
        document.documentElement.dataset.theme = theme;
        try {
          var look = JSON.parse(saved);
          // The CSS is only ever written by the app, but is checked for the characters it is made of anyway.
          if (look && look.v === 1 && look.css && typeof look.css === 'string' && /^[\w\s#.,:;{}'\[\]=\-]*$/.test(look.css)) {
            var style = document.createElement('style');
            style.id = 'rf-look';
            style.textContent = look.css;
            document.head.appendChild(style);
            if (look.bg && typeof look.bg[theme] === 'string' && /^#[0-9a-f]{6}$/i.test(look.bg[theme])) bg = look.bg[theme];
          }
        } catch (e) {}
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
      })();
    </script>
    <meta name="description" content="ReelForge: a full video editor for content creators that runs on your phone." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReelForge" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ReelForge</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ReelForge needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
